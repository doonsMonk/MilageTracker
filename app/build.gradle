plugins {
    id 'com.android.application'
}

android {
    namespace 'app.mileagelog'
    compileSdk 35

    defaultConfig {
        applicationId 'app.mileagelog'
        minSdk 29
        targetSdk 35
        versionCode 5
        versionName '1.4'
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
}

dependencies {
    // Google sign-in / authorization for Drive sync
    implementation 'com.google.android.gms:play-services-auth:21.3.0'
}
