plugins {
    id 'com.android.application'
}

android {
    namespace 'app.mileagelog'
    compileSdk 35

    defaultConfig {
        applicationId 'app.mileagelog'
        minSdk 29
        targetSdk 35
        versionCode 6
        versionName '1.5'
    }

    // Release signing. The key and its passwords live outside the repository, in
    // ../signing/keystore.properties (storeFile, storePassword, keyAlias, keyPassword).
    def keystoreProps = new Properties()
    def keystoreFile = rootProject.file('../signing/keystore.properties')
    if (keystoreFile.exists()) {
        keystoreFile.withInputStream { keystoreProps.load(it) }
        signingConfigs {
            release {
                storeFile file(keystoreProps['storeFile'])
                storePassword keystoreProps['storePassword']
                keyAlias keystoreProps['keyAlias']
                keyPassword keystoreProps['keyPassword']
            }
        }
    }

    buildTypes {
        release {
            debuggable false
            minifyEnabled false
            if (keystoreFile.exists()) signingConfig signingConfigs.release
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
}

dependencies {
    // Google sign-in / authorization for Drive sync
    implementation 'com.google.android.gms:play-services-auth:21.3.0'
}

// Build without the personal starting data:  gradlew assembleDebug -PnoPersonalData
// (used for the APK published in /release)
if (project.hasProperty('noPersonalData')) {
    android.androidResources.ignoreAssetsPattern = '!seed.js:!car.jpg:!.svn:!.git:!.ds_store:!*.scc:.*:!CVS:!thumbs.db:!picasa.ini:!*~'
}
